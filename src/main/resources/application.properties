spring.application.name=adquirencia-core
# Usa el puerto que asigne la plataforma (Railway/Render) y 8080 en local.
server.port=${PORT:8080}
spring.jackson.serialization.write-dates-as-timestamps=false

# El navegador debe revalidar cada archivo antes de reusarlo. Sin esto, quien ya
# visitó el sitio se queda con la copia guardada: la raíz servía el Core antes de
# que ahí viviera el landing, y esa copia vieja seguiría abriendo el Core.
# La revalidacion es barata (responde 304 si nada cambió) y garantiza que
# cualquier ajuste de última hora llegue a todos los teléfonos al instante.
spring.web.resources.cache.cachecontrol.no-cache=true
