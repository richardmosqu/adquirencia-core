<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · Core de Adquirencia · PagueloFacil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%236BBE22'/%3E%3Cpath d='M16 6a10 10 0 1 0 10 10h-5a5 5 0 1 1-5-5z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    :root {
      --green-500: #6BBE22; --green-700: #55990F; --green-800: #175E1A; --green-100: #EDFFD6;
      --ink: #1e2227; --ink-2: #515a69; --muted: #7d889b;
      --line: #E9EBEE; --field-line: #D7DAE0; --gray-100: #FAFBFB; --gray-200: #F2F3F5;
      --red-100: #FDECEC; --red-700: #B42318;
      --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); color: var(--ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background:
        radial-gradient(1100px 520px at 15% -10%, var(--green-100), transparent 60%),
        radial-gradient(900px 500px at 110% 120%, #E2FFBD, transparent 55%),
        var(--gray-200);
    }
    .login-card {
      width: 100%; max-width: 400px; background: #fff; border-radius: 20px;
      box-shadow: 0 18px 50px rgba(20, 30, 40, 0.14); padding: 34px 32px 30px;
    }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; }
    .brand img { height: 34px; }
    .brand .tag {
      font-size: 12px; font-weight: 600; color: var(--green-800);
      background: var(--green-100); border-radius: 999px; padding: 3px 12px;
    }
    h1 { font-size: 19px; font-weight: 700; text-align: center; letter-spacing: -0.3px; }
    .sub { text-align: center; font-size: 13px; color: var(--ink-2); margin: 4px 0 20px; }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
    .field { margin-bottom: 16px; }
    input {
      width: 100%; font-family: var(--font); font-size: 14px; padding: 11px 13px;
      border: 1px solid var(--field-line); border-radius: 11px; background: #fff; color: var(--ink);
    }
    input:focus { outline: 2px solid var(--green-500); outline-offset: 1px; border-color: var(--green-500); }
    .btn {
      width: 100%; font-family: var(--font); font-size: 14.5px; font-weight: 600;
      border: 0; border-radius: 999px; background: var(--green-500); color: #fff;
      padding: 12px; cursor: pointer; margin-top: 6px;
    }
    .btn:hover { background: var(--green-700); }
    .error {
      display: none; background: var(--red-100); color: var(--red-700);
      font-size: 13px; border-radius: 10px; padding: 10px 12px; margin-bottom: 16px;
    }
    .error.show { display: block; }
    .foot { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 18px; }
  </style>
</head>
<body>
  <form class="login-card" method="post" action="/login" autocomplete="on">
    <div class="brand">
      <img src="img/logo-pf.svg" alt="PagueloFacil">
      <span class="tag">Core de Adquirencia</span>
    </div>
    <h1>Bienvenido de vuelta</h1>
    <p class="sub">Ingresa con las credenciales del equipo para continuar.</p>

    <div class="error" id="error">Usuario o contraseña incorrectos. Inténtalo de nuevo.</div>

    <div class="field">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="Tu usuario">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Tu contraseña">
    </div>

    <button type="submit" class="btn">Ingresar</button>
    <p class="foot">Acceso interno del área de Adquirencia de PagueloFacil.</p>
  </form>

  <script>
    if (new URLSearchParams(location.search).has("error")) {
      document.getElementById("error").classList.add("show");
    }
  </script>
</body>
</html>
